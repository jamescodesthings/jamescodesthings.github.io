name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build site
        run: make build

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: public/
          if-no-files-found: error
          include-hidden-files: true

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: public/

      # scripts/serve.js serves public/ over local HTTP/2 with gzip, like GitHub Pages. Pinned @lhci/cli
      # comes from package-lock.json; the config and thresholds are in lighthouserc.json.
      - name: Serve site and run Lighthouse CI
        run: |
          node scripts/serve.js 8099 &
          sleep 2
          npx lhci autorun --config=lighthouserc.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore

  deploy:
    needs: [build, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: public/

      - name: Deploy to pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: pages
          cname: codesthings.com
