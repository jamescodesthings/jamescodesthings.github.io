services:
  build:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run build"

  base:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install"

  dev:
    extends:
      service: base
    ports:
      - 8080:8080
    command: sh -c "npm install && node --no-deprecation src/watch.js & node
      --no-deprecation src/server.js & wait"

  pages:
    extends:
      service: base
    depends_on:
      build:
        condition: service_completed_successfully
    command: sh -c "npm install && npm run pages"

  serve:
    image: joseluisq/static-web-server:2-alpine
    network_mode: host
    restart: unless-stopped
    environment:
      - SERVER_ROOT=/var/public
      - SERVER_PORT=8080
      - SERVER_HEALTH=true
    depends_on:
      build:
        condition: service_completed_successfully
    volumes:
      - ./public:/var/public
    healthcheck:
      test: "nc -z localhost 8080 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    environment:
      API_TIMEOUT: 300s
      LOG_LEVEL: info
    depends_on:
      serve:
        condition: service_healthy
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  pdf:
    extends:
      service: base
    network_mode: host
    environment:
      SERVER_URL: http://localhost:8080
      GOTENBERG_URL: http://localhost:3000
    depends_on:
      serve:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    command: sh -c "npm install && npm run pdf"
